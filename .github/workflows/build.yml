name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install elan
        run: |
          set -euo pipefail
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Install Lean toolchain
        run: elan toolchain install "$(cat lean-toolchain)"

      - name: Cache lake build
        uses: actions/cache@v4
        with:
          path: |
            .lake/build
            .lake/packages/mathlib/.lake/build
          key: ${{ runner.os }}-lake-${{ hashFiles('lake-manifest.json', 'lean-toolchain') }}
          restore-keys: |
            ${{ runner.os }}-lake-

      - name: Build
        run: lake build

      - name: Verify zero sorry / admit
        run: |
          if grep -rn -E "^\s*(sorry|admit)\b" QanaryContracts/ --include="*.lean"; then
            echo "::error::Found sorry/admit in QanaryContracts/"
            exit 1
          fi

      - name: Verify zero project axiom declarations
        run: |
          if grep -rn "^axiom " QanaryContracts/ --include="*.lean"; then
            echo "::error::Found project axiom declaration in QanaryContracts/"
            exit 1
          fi

      - name: Verify headline theorem axiom set
        run: |
          set -euo pipefail
          output=$(lake env lean QanaryContracts/PrintAxioms.lean 2>&1)
          headline=$(echo "$output" | grep "oz_guard_prevents_reentrancy" || true)
          echo "$headline"
          if ! echo "$headline" | grep -q "depends on axioms: \[propext, Classical.choice, Quot.sound\]"; then
            echo "::error::oz_guard_prevents_reentrancy axiom set differs from expected"
            echo "::error::expected: [propext, Classical.choice, Quot.sound]"
            exit 1
          fi
