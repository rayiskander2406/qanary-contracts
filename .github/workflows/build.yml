name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install elan
        run: |
          set -euo pipefail
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Install Lean toolchain
        run: elan toolchain install "$(cat lean-toolchain)"

      - name: Cache lake build
        uses: actions/cache@v4
        with:
          path: |
            .lake/build
            .lake/packages/mathlib/.lake/build
          key: ${{ runner.os }}-lake-${{ hashFiles('lake-manifest.json', 'lean-toolchain') }}
          restore-keys: |
            ${{ runner.os }}-lake-

      - name: Build
        run: lake build

      - name: Verify zero sorry / admit
        run: |
          if grep -rn -E "^\s*(sorry|admit)\b" QanaryContracts/ --include="*.lean"; then
            echo "::error::Found sorry/admit in QanaryContracts/"
            exit 1
          fi

      - name: Verify zero project axiom declarations
        run: |
          if grep -rn "^axiom " QanaryContracts/ --include="*.lean"; then
            echo "::error::Found project axiom declaration in QanaryContracts/"
            exit 1
          fi

      - name: Verify headline theorem axiom set
        run: |
          set -euo pipefail
          # Lean's #print axioms wraps wide axiom lists across continuation
          # lines (single space + content). Merge them so the per-theorem
          # grep below sees one line per theorem regardless of name length.
          # Phase 5 Session 19: matchesBody_implies_tr_kplus1_eq_lock_general
          # surfaced the wrap behavior; merge handles it generically.
          output=$(lake env lean QanaryContracts/PrintAxioms.lean 2>&1 | awk '
            /^'\''/ { if (acc != "") print acc; acc = $0; next }
            acc != "" && /^ / { sub(/^[ ]+/, " ", $0); acc = acc $0; next }
            { if (acc != "") { print acc; acc = "" } ; print }
            END { if (acc != "") print acc }
          ')
          expected="depends on axioms: [propext, Classical.choice, Quot.sound]"
          # Extended Phase 5 Session 13 Unit 3 (F14): guards all
          # post-Layer-4 / Layer 5 headline theorems against axiom drift on
          # every commit. If any of these acquires a wider axiom profile,
          # CI fails before the change can land. Phase 5 Session 17 Unit 4
          # adds oz_guard_prevents_reentrancy_general (F2-B sub-block
          # beta-2-and-beta-3 merged) — its axiom record is the canonical
          # triple by direct delegation to reentrancy_free_universal.
          # Phase 5 Sessions 21-22 (gamma-2 + gamma-2-residual): three new
          # canonical-triple artifacts join the headline gate.
          # Phase 5 Session 25 (delta-1 closure): two new canonical-triple
          # artifacts close the F4 lift layer under OZGuardDisciplineGeneral.
          # Phase 5 Session 27 (F2 CLOSURE): no_external_calls_implies_RFG
          # substantive sub-case completes the multi-CALL universal soundness
          # theorem structurally.
          theorems=(
            "QanaryContracts.oz_guard_prevents_reentrancy"
            "QanaryContracts.reentrancy_free_universal"
            "QanaryContracts.ozGuardDiscipline_implies_RTO"
            "QanaryContracts.no_functions_implies_RFG"
            "QanaryContracts.oz_guard_prevents_reentrancy_general"
            "QanaryContracts.matchesBody_implies_tr_kplus1_eq_lock_general"
            "QanaryContracts.lock_position_unique_in_C_frame_general"
            "QanaryContracts.unlock_position_unique_in_C_frame_general"
            "QanaryContracts.matchesBody_oz_extracts_positions_general"
            "QanaryContracts.unfoldBody_get?_unlock_general"
            "QanaryContracts.executes_C_guard_locked_during_body_call_general"
            "QanaryContracts.executes_C_guard_unlocked_at_entry_general"
            "QanaryContracts.ozGuardDiscipline_implies_RTO_general"
            "QanaryContracts.no_external_calls_implies_RFG"
          )
          fail=0
          for thm in "${theorems[@]}"; do
            # Escape '?' (allowed in Lean identifiers, e.g.
            # unfoldBody_get?_unlock_general) so ERE doesn't treat it as
            # a quantifier. Phase 5 Session 22 Unit 3 gate extension.
            thm_pat="${thm//\?/\\?}"
            # Anchor the grep to the line beginning with the quoted theorem
            # name to avoid substring collisions.
            line=$(echo "$output" | grep -E "^'${thm_pat}' " || true)
            if [ -z "$line" ]; then
              echo "::error::theorem ${thm} not found in PrintAxioms output"
              echo "::error::add a #print axioms entry to QanaryContracts/PrintAxioms.lean"
              fail=1
              continue
            fi
            echo "$line"
            if ! echo "$line" | grep -qF "$expected"; then
              echo "::error::${thm} axiom set differs from expected"
              echo "::error::expected: ${expected}"
              fail=1
            fi
          done
          if [ "$fail" -ne 0 ]; then exit 1; fi
          echo "PASS: all fourteen headline theorems carry kernel-only axioms"

      - name: Verify F2-B beta-1 theorem axiom records
        run: |
          set -euo pipefail
          output=$(lake env lean QanaryContracts/PrintAxioms.lean 2>&1 | awk '
            /^'\''/ { if (acc != "") print acc; acc = $0; next }
            acc != "" && /^ / { sub(/^[ ]+/, " ", $0); acc = acc $0; next }
            { if (acc != "") { print acc; acc = "" } ; print }
            END { if (acc != "") print acc }
          ')
          # Phase 5 Session 15 Unit 3: F2-B sub-block beta-1 foundation
          # theorems gated against axiom drift. Both have axiom records
          # strictly narrower than the canonical kernel triple, so the
          # exact-match check above doesn't fit; per-theorem expected
          # records used instead. Methodology load-bearing claim
          # ("explicit trusted base") preserved per-theorem.
          fail=0

          # original_is_general_subset -> expects [propext] only.
          line=$(echo "$output" | grep -E "^'QanaryContracts.original_is_general_subset' " || true)
          if [ -z "$line" ]; then
            echo "::error::theorem original_is_general_subset not found in PrintAxioms output"
            echo "::error::add a #print axioms entry to QanaryContracts/PrintAxioms.lean"
            fail=1
          else
            echo "$line"
            if ! echo "$line" | grep -qF "depends on axioms: [propext]"; then
              echo "::error::original_is_general_subset axiom set differs from expected"
              echo "::error::expected: 'depends on axioms: [propext]'"
              fail=1
            fi
          fi

          # f2b_inherits_W4_strengthening -> expects no axioms at all.
          line=$(echo "$output" | grep -E "^'QanaryContracts.f2b_inherits_W4_strengthening' " || true)
          if [ -z "$line" ]; then
            echo "::error::theorem f2b_inherits_W4_strengthening not found in PrintAxioms output"
            echo "::error::add a #print axioms entry to QanaryContracts/PrintAxioms.lean"
            fail=1
          else
            echo "$line"
            if ! echo "$line" | grep -qF "does not depend on any axioms"; then
              echo "::error::f2b_inherits_W4_strengthening axiom set differs from expected"
              echo "::error::expected: 'does not depend on any axioms'"
              fail=1
            fi
          fi

          # Phase 5 Session 17 Unit 4: F2-B sub-block beta-2-and-beta-3
          # merged foundation. OZGuardDiscipline_implies_general lifts
          # Session 15's original_is_general_subset pointwise across the
          # OZGuardDiscipline quantifier; record [propext] confirmed at
          # runtime per an internal VRVP methodology note best-case
          # prediction.

          # OZGuardDiscipline_implies_general -> expects [propext] only.
          line=$(echo "$output" | grep -E "^'QanaryContracts.OZGuardDiscipline_implies_general' " || true)
          if [ -z "$line" ]; then
            echo "::error::theorem OZGuardDiscipline_implies_general not found in PrintAxioms output"
            echo "::error::add a #print axioms entry to QanaryContracts/PrintAxioms.lean"
            fail=1
          else
            echo "$line"
            if ! echo "$line" | grep -qF "depends on axioms: [propext]"; then
              echo "::error::OZGuardDiscipline_implies_general axiom set differs from expected"
              echo "::error::expected: 'depends on axioms: [propext]'"
              fail=1
            fi
          fi

          if [ "$fail" -ne 0 ]; then exit 1; fi
          echo "PASS: F2-B kernel-subset theorems carry expected axiom records"

      - name: Verify F2-B sub-block gamma-1 theorem axiom records
        run: |
          set -euo pipefail
          output=$(lake env lean QanaryContracts/PrintAxioms.lean 2>&1 | awk '
            /^'\''/ { if (acc != "") print acc; acc = $0; next }
            acc != "" && /^ / { sub(/^[ ]+/, " ", $0); acc = acc $0; next }
            { if (acc != "") { print acc; acc = "" } ; print }
            END { if (acc != "") print acc }
          ')
          # Phase 5 Session 19: F2-B sub-block gamma-1 (BodyShape
          # propagation lemmas). Three theorems with axiom records
          # narrower than the canonical kernel triple gate here;
          # the three with the canonical triple are gated in the
          # headline list above. Per-theorem expected records used
          # for the narrower set per Session 15's pattern.
          fail=0

          # unfoldBody_countP_isUnlockStep_eq_one_general -> [propext] only.
          line=$(echo "$output" | grep -E "^'QanaryContracts.unfoldBody_countP_isUnlockStep_eq_one_general' " || true)
          if [ -z "$line" ]; then
            echo "::error::theorem unfoldBody_countP_isUnlockStep_eq_one_general not found in PrintAxioms output"
            echo "::error::add a #print axioms entry to QanaryContracts/PrintAxioms.lean"
            fail=1
          else
            echo "$line"
            if ! echo "$line" | grep -qF "depends on axioms: [propext]"; then
              echo "::error::unfoldBody_countP_isUnlockStep_eq_one_general axiom set differs from expected"
              echo "::error::expected: 'depends on axioms: [propext]'"
              fail=1
            fi
          fi

          # unfoldBody_countP_isLockStep_eq_one_general -> [propext] only.
          line=$(echo "$output" | grep -E "^'QanaryContracts.unfoldBody_countP_isLockStep_eq_one_general' " || true)
          if [ -z "$line" ]; then
            echo "::error::theorem unfoldBody_countP_isLockStep_eq_one_general not found in PrintAxioms output"
            echo "::error::add a #print axioms entry to QanaryContracts/PrintAxioms.lean"
            fail=1
          else
            echo "$line"
            if ! echo "$line" | grep -qF "depends on axioms: [propext]"; then
              echo "::error::unfoldBody_countP_isLockStep_eq_one_general axiom set differs from expected"
              echo "::error::expected: 'depends on axioms: [propext]'"
              fail=1
            fi
          fi

          # guard_sstore_value_in_C_frame_general -> [propext, Quot.sound].
          # Narrower than canonical triple (no Classical.choice).
          # MATCHES original guard_sstore_value_in_C_frame's record exactly.
          line=$(echo "$output" | grep -E "^'QanaryContracts.guard_sstore_value_in_C_frame_general' " || true)
          if [ -z "$line" ]; then
            echo "::error::theorem guard_sstore_value_in_C_frame_general not found in PrintAxioms output"
            echo "::error::add a #print axioms entry to QanaryContracts/PrintAxioms.lean"
            fail=1
          else
            echo "$line"
            if ! echo "$line" | grep -qF "depends on axioms: [propext, Quot.sound]"; then
              echo "::error::guard_sstore_value_in_C_frame_general axiom set differs from expected"
              echo "::error::expected: 'depends on axioms: [propext, Quot.sound]'"
              fail=1
            fi
          fi

          # Phase 5 Session 22 Unit 1 (gamma-2-residual): cFrameProjection
          # length-preservation helper. Path-(alpha) hoisted-helper variant
          # closing the glue-fact gap identified at Session 21 Unit 3
          # fallback. Axiom record [propext, Quot.sound] (intermediate band
          # per M-22.2-candidate "index-bound-only" tactic category).
          line=$(echo "$output" | grep -E "^'QanaryContracts.cFrameProjection_length_eq_pos_length' " || true)
          if [ -z "$line" ]; then
            echo "::error::theorem cFrameProjection_length_eq_pos_length not found in PrintAxioms output"
            echo "::error::add a #print axioms entry to QanaryContracts/PrintAxioms.lean"
            fail=1
          else
            echo "$line"
            if ! echo "$line" | grep -qF "depends on axioms: [propext, Quot.sound]"; then
              echo "::error::cFrameProjection_length_eq_pos_length axiom set differs from expected"
              echo "::error::expected: 'depends on axioms: [propext, Quot.sound]'"
              fail=1
            fi
          fi

          if [ "$fail" -ne 0 ]; then exit 1; fi
          echo "PASS: F2-B sub-block gamma-1 + gamma-2-residual narrower-axiom theorems carry expected records"

      - name: Verify Layer 6-A theorem axiom records
        run: |
          set -euo pipefail
          output=$(lake env lean QanaryContracts/PrintAxioms.lean 2>&1 | awk '
            /^'\''/ { if (acc != "") print acc; acc = $0; next }
            acc != "" && /^ / { sub(/^[ ]+/, " ", $0); acc = acc $0; next }
            { if (acc != "") { print acc; acc = "" } ; print }
            END { if (acc != "") print acc }
          ')
          # Phase 5 Sessions 32-33 (Layer 6-A Phases 3-4): DAO 2016
          # negative-instance certificate's six theorems gated against
          # axiom drift. Two narrower-axiom record patterns coexist:
          #   - zero-axiom (Phase 3 falsifications S32 U2/U3 — head-element
          #     injectivity proofs).
          #   - [propext]-only (Phase 3 master S32 U4 + three Phase 4
          #     wrappers/meta-theorem S33 U1/U2/U3 — composition layer
          #     above destructure-burden-absorbing wrappers).
          # CI gating closes the deferred work from Session 32 Unit 4
          # Option (β) precedent at the unified Layer 6-A consolidation
          # layer. The discriminating-power claim
          # (daoContract_negative_instance_certificate) sits at the meta-
          # theorem layer composing both phases.
          fail=0

          zero_axiom_theorems=(
            "QanaryContracts.OZGuardDisciplineGeneral_falsified_at_withdrawRewardFor"
            "QanaryContracts.OZGuardDisciplineGeneral_falsified_at_splitDAO"
          )
          for thm in "${zero_axiom_theorems[@]}"; do
            line=$(echo "$output" | grep -E "^'${thm}' " || true)
            if [ -z "$line" ]; then
              echo "::error::theorem ${thm} not found in PrintAxioms output"
              echo "::error::add a #print axioms entry to QanaryContracts/PrintAxioms.lean"
              fail=1
              continue
            fi
            echo "$line"
            if ! echo "$line" | grep -qF "does not depend on any axioms"; then
              echo "::error::${thm} axiom set differs from expected (zero-axiom)"
              echo "::error::expected: 'does not depend on any axioms'"
              fail=1
            fi
          done

          propext_only_theorems=(
            "QanaryContracts.daoContract_violates_OZGuardDisciplineGeneral"
            "QanaryContracts.daoContract_predicate_rejected_at_Phase4"
            "QanaryContracts.daoAttackTrace_vulnerability_witness_at_Phase4"
            "QanaryContracts.daoContract_negative_instance_certificate"
          )
          for thm in "${propext_only_theorems[@]}"; do
            line=$(echo "$output" | grep -E "^'${thm}' " || true)
            if [ -z "$line" ]; then
              echo "::error::theorem ${thm} not found in PrintAxioms output"
              echo "::error::add a #print axioms entry to QanaryContracts/PrintAxioms.lean"
              fail=1
              continue
            fi
            echo "$line"
            if ! echo "$line" | grep -qF "depends on axioms: [propext]"; then
              echo "::error::${thm} axiom set differs from expected ([propext]-only)"
              echo "::error::expected: 'depends on axioms: [propext]'"
              fail=1
            fi
          done

          if [ "$fail" -ne 0 ]; then exit 1; fi
          echo "PASS: all six Layer 6-A theorems carry expected kernel-only axiom records"

      - name: Verify Layer 6-B theorem axiom records
        run: |
          set -euo pipefail
          output=$(lake env lean QanaryContracts/PrintAxioms.lean 2>&1 | awk '
            /^'\''/ { if (acc != "") print acc; acc = $0; next }
            acc != "" && /^ / { sub(/^[ ]+/, " ", $0); acc = acc $0; next }
            { if (acc != "") { print acc; acc = "" } ; print }
            END { if (acc != "") print acc }
          ')
          # Phase 5 Session 38 (Layer 6-B Phases 3-4 compressed closure):
          # Compound v2 cToken positive-instance certificate's three
          # theorems gated against axiom drift. All three carry
          # [propext]-only records (M-22.2 Tier 1 wrapper-layer
          # absorption pattern empirically applied at Layer 6-B —
          # third bidirectional instance after Layer 6-A Phase 3 master
          # and Phase 4 meta-theorem). The discriminating-power claim's
          # positive side closes at the meta-theorem layer
          # (compoundContract_positive_instance_certificate). Together
          # with Layer 6-A's negative-instance certificate at the block
          # above, the bidirectional discriminating-power claim is
          # structurally grounded — rejection demonstrated at deployed
          # historical artifact (DAO 2016) plus acceptance demonstrated
          # at deployed production reference (cDAI's Compound v2 cToken
          # family at 0x5d3a536e4d6dbd6114cc1ead35777bab948e3643 per
          # Session 36 closure framing; abstract-pattern-load-bearing
          # per Question 5d Option (X-prime)).
          fail=0

          propext_only_theorems=(
            "QanaryContracts.compoundContract_satisfies_OZGuardDisciplineGeneral"
            "QanaryContracts.compoundContract_predicate_accepted_at_PhaseY"
            "QanaryContracts.compoundContract_positive_instance_certificate"
          )
          for thm in "${propext_only_theorems[@]}"; do
            line=$(echo "$output" | grep -E "^'${thm}' " || true)
            if [ -z "$line" ]; then
              echo "::error::theorem ${thm} not found in PrintAxioms output"
              echo "::error::add a #print axioms entry to QanaryContracts/PrintAxioms.lean"
              fail=1
              continue
            fi
            echo "$line"
            if ! echo "$line" | grep -qF "depends on axioms: [propext]"; then
              echo "::error::${thm} axiom set differs from expected ([propext]-only)"
              echo "::error::expected: 'depends on axioms: [propext]'"
              fail=1
            fi
          done

          if [ "$fail" -ne 0 ]; then exit 1; fi
          echo "PASS: all three Layer 6-B theorems carry expected [propext]-only axiom records"

      - name: Verify Layer 6-C theorem axiom records
        run: |
          set -euo pipefail
          output=$(lake env lean QanaryContracts/PrintAxioms.lean 2>&1 | awk '
            /^'\''/ { if (acc != "") print acc; acc = $0; next }
            acc != "" && /^ / { sub(/^[ ]+/, " ", $0); acc = acc $0; next }
            { if (acc != "") { print acc; acc = "" } ; print }
            END { if (acc != "") print acc }
          ')
          # Phase 5 Sessions 40-41 (Layer 6-C Phases 3-4 sequenced closure
          # under Path B): Aave V3 paired theorem boundary case certificate's
          # three Phase-4-composition theorems gated against axiom drift.
          # All three carry [propext]-only records (M-22.2 Tier 1 wrapper-
          # layer absorption pattern empirically applied at Layer 6-C —
          # fourth empirical instance after Layer 6-A Phase 3 master,
          # Layer 6-A Phase 4 meta-theorem, and Layer 6-B Theorem A).
          # The discriminating-power claim's structural-neighborhood
          # discriminating-granularity side closes at the meta-theorem
          # layer (aaveBoundaryCase_certificate). Together with Layer 6-A's
          # negative-instance certificate and Layer 6-B's positive-instance
          # certificate at the blocks above, the tridirectional
          # discriminating-power claim is structurally grounded — rejection
          # at deployed historical reference (DAO 2016) + acceptance at
          # deployed production reference (cDAI Compound v2 cToken family)
          # + structural-neighborhood discrimination at boundary case
          # (Aave V3 protocol-by-design `flashLoan` at
          # 0x87870bca3f3fd6335c3f4ce8392d69350b4fa4e2 vs structurally
          # adjacent vulnerable `flashLoanVulnerable`; abstract-pattern-
          # load-bearing per Question 8e Framing (a) body-shape-vs-trace-
          # layer discrimination).
          fail=0

          propext_only_theorems=(
            "QanaryContracts.aaveContract_satisfies_OZGuardDisciplineGeneral_at_flashLoan"
            "QanaryContracts.aaveContractAdjacent_violates_OZGuardDisciplineGeneral_at_flashLoanVulnerable"
            "QanaryContracts.aaveBoundaryCase_certificate"
          )
          for thm in "${propext_only_theorems[@]}"; do
            line=$(echo "$output" | grep -E "^'${thm}' " || true)
            if [ -z "$line" ]; then
              echo "::error::theorem ${thm} not found in PrintAxioms output"
              echo "::error::add a #print axioms entry to QanaryContracts/PrintAxioms.lean"
              fail=1
              continue
            fi
            echo "$line"
            if ! echo "$line" | grep -qF "depends on axioms: [propext]"; then
              echo "::error::${thm} axiom set differs from expected ([propext]-only)"
              echo "::error::expected: 'depends on axioms: [propext]'"
              fail=1
            fi
          done

          if [ "$fail" -ne 0 ]; then exit 1; fi
          echo "PASS: all three Layer 6-C theorems carry expected [propext]-only axiom records"

      - name: Verify Layer 6-D cross-protocol theorem axiom records
        run: |
          set -euo pipefail
          output=$(lake env lean QanaryContracts/PrintAxioms.lean 2>&1 | awk '
            /^'\''/ { if (acc != "") print acc; acc = $0; next }
            acc != "" && /^ / { sub(/^[ ]+/, " ", $0); acc = acc $0; next }
            { if (acc != "") { print acc; acc = "" } ; print }
            END { if (acc != "") print acc }
          ')
          # Phase 5 Session 42 (Layer 6-D cross-protocol audit substrate):
          # Tridirectional discriminating-power certificate gated against
          # axiom drift. Carries [propext]-only record (M-22.2 Tier 1
          # wrapper-layer absorption pattern fifth empirical instance after
          # Layer 6-A Phase 3 master + Phase 4 meta-theorem, Layer 6-B
          # compressed master, and Layer 6-C boundary-case meta-theorem).
          # Composes Layer 6-A negative-instance, Layer 6-B positive-
          # instance, and Layer 6-C boundary-case certificates via direct
          # anonymous-constructor ⟨α, β, γ⟩ — paper §10 Section 10.3 single
          # load-bearing citable anchor for the tridirectional
          # discriminating-power claim. Layer-scope-symmetry across four
          # parallel CI blocks preserved per Decision 1 (parallel
          # preservation on M-26.1 compose-from-outside grounds; Layer 6-A
          # block at line 287, Layer 6-B at line 356, Layer 6-C at line
          # 408, Layer 6-D at this block) — the four-protocol-instantiation
          # boundaries (DAO 2016 / Compound v2 cToken / Aave V3 flashLoan /
          # structurally adjacent flashLoanVulnerable) audit-gate
          # independently. First cross-protocol stress-test of M-26.1
          # discipline at the audit gate layer.
          fail=0

          propext_only_theorems=(
            "QanaryContracts.tridirectionalDiscriminatingPower_certificate"
          )
          for thm in "${propext_only_theorems[@]}"; do
            line=$(echo "$output" | grep -E "^'${thm}' " || true)
            if [ -z "$line" ]; then
              echo "::error::theorem ${thm} not found in PrintAxioms output"
              echo "::error::add a #print axioms entry to QanaryContracts/PrintAxioms.lean"
              fail=1
              continue
            fi
            echo "$line"
            if ! echo "$line" | grep -qF "depends on axioms: [propext]"; then
              echo "::error::${thm} axiom set differs from expected ([propext]-only)"
              echo "::error::expected: 'depends on axioms: [propext]'"
              fail=1
            fi
          done

          if [ "$fail" -ne 0 ]; then exit 1; fi
          echo "PASS: Layer 6-D tridirectional discriminating-power certificate carries expected [propext]-only axiom record"
